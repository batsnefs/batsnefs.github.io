<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>batsnefs</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👀</text></svg>">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #000;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    text-align: center;
    overflow: hidden;
  }
  .eyes {
    all: unset;
    display: flex;
    gap: 18px;
    cursor: pointer;
    border-radius: 999px;
  }
  .eyes:focus-visible { outline: 2px solid #fff; outline-offset: 10px; }
  .eye {
    width: clamp(64px, 16vw, 96px);
    aspect-ratio: 1;
    background: #fff;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
  }
  .eye::before {
    content: "";
    position: absolute; inset: 0;
    background: #222;
    transform: translateY(-102%);
    transition: transform .08s ease-out;
    z-index: 1;
  }
  .eye.blink::before { transform: translateY(0); }
  .pupil {
    position: absolute; left: 50%; top: 50%;
    width: 42%; height: 42%;
    background: #000;
    border-radius: 50%;
    transform: translate(calc(-50% + var(--x, 0px)), calc(-50% + var(--y, 0px))) scale(var(--s, 1));
    transition: transform .06s linear;
  }
  .eyes.ouch .pupil { --s: .45; }

  p {
    margin: 0;
    color: #777;
    font-size: .95rem;
    letter-spacing: .02em;
    min-height: 1.4em;
  }
  footer {
    position: fixed;
    bottom: 1.2rem;
    color: #444;
    font-size: .75rem;
  }
</style>
</head>
<body>
  <button class="eyes" id="eyes" aria-label="Poke the eyes">
    <div class="eye"><div class="pupil"></div></div>
    <div class="eye"><div class="pupil"></div></div>
  </button>
  <p id="say" aria-live="polite">nothing to show here.</p>
  <footer>© 2026 batsnefs</footer>

<script>
(() => {
  const btn = document.getElementById('eyes');
  const eyes = [...document.querySelectorAll('.eye')];
  const say = document.getElementById('say');
  const base = 'nothing to show here.';
  let idle = 0, timer;

  function look(x, y) {
    eyes.forEach(e => {
      const r = e.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const a = Math.atan2(y - cy, x - cx);
      const d = Math.min(Math.hypot(x - cx, y - cy) / 6, r.width * 0.22);
      const p = e.firstElementChild;
      p.style.setProperty('--x', Math.cos(a) * d + 'px');
      p.style.setProperty('--y', Math.sin(a) * d + 'px');
    });
  }
  addEventListener('pointermove', e => { idle = 0; look(e.clientX, e.clientY); });
  addEventListener('pointerdown', e => { idle = 0; look(e.clientX, e.clientY); });
  look(innerWidth / 2, innerHeight / 2);

  setInterval(() => {
    if (++idle > 2) look(Math.random() * innerWidth, Math.random() * innerHeight);
  }, 1800);

  (function blink() {
    eyes.forEach(e => e.classList.add('blink'));
    setTimeout(() => eyes.forEach(e => e.classList.remove('blink')), 130);
    setTimeout(blink, 2000 + Math.random() * 3500);
  })();

  const lines = ['ow.', 'rude.', "i'm empty. i checked.", 'stop it.', 'go touch grass.', 'still nothing.'];
  btn.addEventListener('click', () => {
    btn.classList.add('ouch');
    setTimeout(() => btn.classList.remove('ouch'), 250);
    say.textContent = lines[Math.random() * lines.length | 0];
    clearTimeout(timer);
    timer = setTimeout(() => say.textContent = base, 1800);
  });
})();
</script>
</body>
</html>
