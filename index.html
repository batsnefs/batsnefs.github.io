*{box-sizing:border-box}html,body{margin:0}body{background:radial-gradient(900px 500px at 80% -10%,#2a2a0d 0,transparent 60%),var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding-top:var(--sf)}
h1,h2,h3,.brand b,.big{font-family:Sora,system-ui,sans-serif;letter-spacing:-.02em}button{font:inherit;color:inherit;cursor:pointer}
header,footer{max-width:1100px;margin:auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0}.mark{width:36px;height:36px;flex:none;border-radius:11px;background:var(--pfp) center/cover;border:1px solid var(--g)}.brand b{font-size:19px}.brand b{display:flex;flex-direction:column;align-items:flex-start;text-align:left;line-height:1.1;font-size:clamp(14px,3.8vw,19px)}.brand small{font:500 12px system-ui;color:var(--mu);margin-top:3px}header{flex-wrap:wrap}
nav{display:flex;gap:6px}nav button,.btn{border:1px solid var(--ln);background:var(--p);border-radius:10px;padding:9px 15px;font-weight:600;transition:.15s}nav button:hover,.btn:hover:not(:disabled){border-color:var(--g)}.btn:disabled{opacity:.35;cursor:not-allowed}.btn.pri{background:var(--g);color:#1a1403;border-color:var(--g)}.btn.dng{border-color:#5a2438;color:var(--r)}
main{max-width:1100px;margin:auto;padding:8px 16px 40px}.card{background:var(--p);border:1px solid var(--ln);border-radius:16px;padding:20px}
.hero{padding:34px 0 22px}.hero h1{font-size:clamp(30px,6vw,56px);line-height:1.05;margin:0 0 12px}.hero p{color:var(--mu);max-width:56ch;margin:0 0 18px}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.seg{display:flex;border:1px solid var(--ln);border-radius:11px;overflow:hidden}.seg button{border:0;background:var(--p);padding:9px 16px;font-weight:600}.seg button.on{background:var(--g);color:#1a1403}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:18px}.qc{text-align:left;display:flex;flex-direction:column;gap:6px;transition:.2s}.qc:hover{transform:translateY(-3px);border-color:var(--g)}.qc h3{margin:0;font-size:18px}.qc small{color:var(--mu)}.tag{color:var(--g);font-size:13px}
.wide{grid-column:1/-1}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}select,input[type=number]{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:9px;padding:9px 10px;font:inherit}label{display:flex;flex-direction:column;gap:4px;color:var(--mu);font-size:13px}
.banner{border-color:var(--g);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;margin-top:8px}@media(max-width:860px){.qwrap{grid-template-columns:1fr}}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px}.timer{font:800 26px Sora;font-variant-numeric:tabular-nums}.timer.low{color:var(--r);animation:pl 1s infinite}@keyframes pl{50%{opacity:.5}}
.bar{height:5px;background:var(--p2);border-radius:9px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--g);transition:width .35s}
.q{position:relative;overflow:hidden;animation:in .25s}@keyframes in{from{opacity:0;transform:translateX(12px)}}
.q:after{content:"";position:absolute;right:10px;bottom:10px;width:110px;height:110px;border-radius:18px;background:var(--pfp) center/cover;opacity:.07;pointer-events:none;transform:rotate(-6deg)}
.q h2{font-size:clamp(18px,2.6vw,23px);line-height:1.45;margin:6px 0 18px;font-weight:600}.num{color:var(--g);font-weight:700;font-size:14px}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--p2);border:1px solid var(--ln);border-radius:11px;padding:13px 14px;margin-bottom:10px;transition:.15s}.opt:hover{border-color:var(--g)}.opt .l{flex:0 0 28px;height:28px;border-radius:8px;border:1px solid var(--ln);display:grid;place-items:center;font-weight:700}.opt.sel{border-color:var(--g);background:#232610}.opt.sel .l{background:var(--g);color:#1a1403;border-color:var(--g)}
.opt.ok{border-color:var(--g);background:#232610}.opt.ok .l{background:var(--g);color:#1a1403}.opt.bad{border-color:var(--r);background:#2e1220}.opt.bad .l{background:var(--r);color:#200}
.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px}.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.pn{height:36px;border-radius:8px;border:1px solid var(--ln);background:var(--p2);font-weight:700;position:relative}.pn.a{background:var(--g2);border-color:var(--g2)}.pn.c{outline:2px solid var(--g);outline-offset:1px}.pn.m:after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--y)}
.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mu);margin:10px 0}.flag{color:var(--y);font-size:13px;margin-top:8px}
.ring{display:grid;place-items:center;position:relative;width:170px;height:170px}.ring svg{position:absolute;transform:rotate(-90deg)}.ring .big{font-size:38px;font-weight:800}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:16px 0}.st div{background:var(--p2);border-radius:12px;padding:12px}.st b{display:block;font:700 24px Sora}.st span{color:var(--mu);font-size:13px}
.rv{margin-bottom:12px}.rv .opt{cursor:default;margin-bottom:6px}.chips button{margin:0 6px 8px 0}.hb{height:8px;background:var(--p2);border-radius:5px;overflow:hidden;margin:4px 0 10px}.hb i{display:block;height:100%}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:9;padding:16px}.ov .card{max-width:420px;width:100%}
footer{color:var(--mu);font-size:13px;border-top:1px solid var(--ln);margin-top:20px}
.fx{position:fixed;pointer-events:none;z-index:99;font-size:26px;animation-timing-function:linear;animation-fill-mode:forwards}@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(112vh) rotate(360deg)}}@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translate(var(--x,0),-112vh);opacity:0}}@keyframes gal{from{transform:translateX(-15vw) rotate(-10deg)}50%{transform:translateX(50vw) rotate(10deg)}to{transform:translateX(115vw) rotate(-10deg)}}@keyframes shk{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}@keyframes hue{to{filter:hue-rotate(360deg)}}@keyframes pop{0%{transform:translate(-50%,-50%) scale(0) rotate(0)}35%{transform:translate(-50%,-50%) scale(1.1) rotate(360deg)}80%{transform:translate(-50%,-50%) scale(1) rotate(360deg);opacity:1}100%{transform:translate(-50%,-50%) scale(1.3) rotate(360deg);opacity:0}}.pop{position:fixed;left:50%;top:50%;width:min(60vw,260px);aspect-ratio:1;border-radius:24px;background:var(--pfp) center/cover;border:3px solid var(--g);z-index:99;pointer-events:none;animation:pop 2.2s forwards}.tst{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--p2);border:1px solid var(--g);padding:10px 18px;border-radius:12px;z-index:100;pointer-events:none}.lay{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;cursor:pointer;animation:lin .5s both}.lay.out{animation:lout .6s forwards}@keyframes lin{from{opacity:0}}@keyframes lout{to{opacity:0}}
.blk{background:#000}.spot{width:min(64vw,300px);aspect-ratio:3/4}.spot img{width:100%;height:100%;object-fit:cover;border-radius:20px;animation:spt 1.8s 1.2s ease-out backwards}@keyframes spt{from{clip-path:circle(0 at 50% 45%)}to{clip-path:circle(80% at 50% 45%)}}
.tw{font:800 clamp(22px,5vw,38px) Sora,system-ui,sans-serif;min-height:1.4em;margin:0;padding:0 16px;text-align:center}.tw:after{content:"\25cd";color:var(--g);animation:pl 1s infinite}
.sus{background:radial-gradient(circle at 50% 40%,#5a0a14,#12020a 70%)}.sw{font:800 clamp(30px,8vw,72px) Sora,system-ui,sans-serif;color:#ff4d5e;text-shadow:0 0 24px #ff1f3a;text-align:center;animation:shk .4s 4}.ej{width:min(46vw,210px);aspect-ratio:1;object-fit:cover;border-radius:50%;border:4px solid #ff4d5e;animation:ejc 4.6s .4s both}

function stats(){const n=H.length,avg=n?Math.round(H.reduce((a,h)=>a+h.pct,0)/n):0,best=n?Math.max(...H.map(h=>h.pct)):0,tt={};H.forEach(h=>Object.entries(h.tp).forEach(([t,[c,m]])=>{tt[t]=tt[t]||[0,0];tt[t][0]+=c;tt[t][1]+=m}));

<div class="card"><h3 style="margin-top:0">Most-missed questions</h3>${miss.map(([id,w,t])=>`<p style="margin:0 0 10px;font-size:14px"><b>#${id}</b> missed ${w}/${t}: ${esc(byN(id).q.slice(0,70))}…</p>`).join("")||"No misses yet."}</div></div>
